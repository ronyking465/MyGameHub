<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Withdraw PIN</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f5f7fb;

            font-family:
                Arial,
                sans-serif;

            padding: 20px;
        }


        .box {

            width: 92%;

            max-width: 420px;

            background: #fff;

            padding: 28px;

            border-radius: 18px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, .10);
        }


        h2 {

            text-align: center;

            margin:
                0 0 8px;
        }


        .sub {

            text-align: center;

            color: #777;

            margin-bottom: 25px;

            line-height: 1.5;

            font-size: 14px;
        }


        .group {

            margin-bottom: 16px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;
        }


        input {

            width: 100%;

            padding: 13px;

            border:
                1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }


        input:focus {

            border-color: #555;
        }


        button {

            width: 100%;

            padding: 13px;

            border: 0;

            border-radius: 10px;

            background: #222;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        button:disabled {

            opacity: .6;

            cursor: not-allowed;
        }


        .message {

            text-align: center;

            margin-top: 15px;

            font-size: 14px;

            min-height: 20px;
        }


        .back {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #333;

            text-decoration: none;
        }


        .back:hover {

            text-decoration:
                underline;
        }

    </style>

</head>


<body>


<div class="box">


    <h2>
        Forgot Withdraw PIN
    </h2>


    <div class="sub">

        Enter your mobile number
        and login password to
        create a new withdraw PIN.

    </div>


    <!-- MOBILE -->
<div class="group">
    <label>Mobile Number</label>

    <input
        id="mobile"
        type="tel"
        maxlength="10"
        placeholder="Enter mobile number"
    >
</div>

<div class="group">
    <label>Current Withdraw Password</label>

    <input
        id="currentWithdrawPassword"
        type="password"
        placeholder="Enter current withdraw password"
    >
</div>

<div class="group">
    <label>New Withdraw Password</label>

    <input
        id="newWithdrawPassword"
        type="password"
        maxlength="8"
        placeholder="Enter new withdraw password"
    >
</div>

<div class="group">
    <label>Confirm New Withdraw Password</label>

    <input
        id="confirmWithdrawPassword"
        type="password"
        maxlength="8"
        placeholder="Confirm new withdraw password"
    >
</div>

<button id="resetWithdrawBtn">
    Reset Withdraw Password
</button>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="login.html"
        class="back"
    >
        ← Back to Login
    </a>


</div>


<script>

"use strict";

const API =
    "/api/auth";


// ======================================================
// DOM
// ======================================================

const mobile =
    document.getElementById("mobile");

const currentWithdrawPassword =
    document.getElementById(
        "currentWithdrawPassword"
    );

const newWithdrawPassword =
    document.getElementById(
        "newWithdrawPassword"
    );

const confirmWithdrawPassword =
    document.getElementById(
        "confirmWithdrawPassword"
    );

const resetWithdrawBtn =
    document.getElementById(
        "resetWithdrawBtn"
    );

const message =
    document.getElementById("message");


// ======================================================
// MESSAGE
// ======================================================

function showMessage(text, error = false) {

    message.textContent = text;

    message.style.color =
        error
            ? "#d00000"
            : "#16803c";
}


// ======================================================
// RESET WITHDRAW PASSWORD
// ======================================================

resetWithdrawBtn.addEventListener(
    "click",
    async function () {

        const mobileValue =
            mobile.value.trim();

        const currentValue =
            currentWithdrawPassword.value.trim();

        const newValue =
            newWithdrawPassword.value.trim();

        const confirmValue =
            confirmWithdrawPassword.value.trim();


        // ==================================================
        // MOBILE
        // ==================================================

        if (!/^[6-9]\d{9}$/.test(mobileValue)) {

            showMessage(
                "Enter a valid 10 digit mobile number.",
                true
            );

            return;
        }


        // ==================================================
        // CURRENT WITHDRAW PASSWORD
        // ==================================================

        if (!/^\d{6,8}$/.test(currentValue)) {

            showMessage(
                "Current withdraw password must be 6 to 8 digits.",
                true
            );

            return;
        }


        // ==================================================
        // NEW WITHDRAW PASSWORD
        // ==================================================

        if (!/^\d{6,8}$/.test(newValue)) {

            showMessage(
                "New withdraw password must be 6 to 8 digits.",
                true
            );

            return;
        }


        // ==================================================
        // CONFIRM
        // ==================================================

        if (newValue !== confirmValue) {

            showMessage(
                "Withdraw passwords do not match.",
                true
            );

            return;
        }


        // ==================================================
        // BUTTON
        // ==================================================

        resetWithdrawBtn.disabled = true;

        resetWithdrawBtn.textContent =
            "Resetting...";

        showMessage("");


        try {

            const response =
                await fetch(
                    API +
                    "/reset-withdraw-password",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                mobile:
                                    mobileValue,

                                currentWithdrawPassword:
                                    currentValue,

                                newWithdrawPassword:
                                    newValue

                            })
                    }
                );


            const data =
                await response.json();


            // ==================================================
            // ERROR
            // ==================================================

            if (
                !response.ok ||
                !data.success
            ) {

                showMessage(
                    data.message ||
                    "Withdraw password reset failed.",
                    true
                );

                resetWithdrawBtn.disabled =
                    false;

                resetWithdrawBtn.textContent =
                    "Reset Withdraw Password";

                return;
            }


            // ==================================================
            // SUCCESS
            // ==================================================

            showMessage(
                "Withdraw password changed successfully."
            );

            resetWithdrawBtn.textContent =
                "Success";


            setTimeout(
                function () {

                    window.location.href =
                        "login.html";

                },
                1500
            );


        } catch (error) {

            console.error(
                "RESET WITHDRAW PASSWORD ERROR:",
                error
            );

            showMessage(
                "Server connection failed.",
                true
            );

            resetWithdrawBtn.disabled =
                false;

            resetWithdrawBtn.textContent =
                "Reset Withdraw Password";

        }

    }
);

</script>


</body>

</html>
