<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B-Portal Login</title>
<link rel="stylesheet" href="css/toast.css">

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">



<style>

body{

background-image:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
url("https://nextwhatbusiness.com/wp-content/uploads/2023/07/britanniabiscuits-1-jpg.webp");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

background-attachment:fixed;

}

.glass{

backdrop-filter:blur(18px);

background:rgba(255,255,255,.12);

border:1px solid rgba(255,255,255,.2);

box-shadow:0 10px 40px rgba(0,0,0,.35);

}

.input{
width:100%;
height:52px;
padding:14px 18px 14px 52px;
border-radius:14px;
background:rgba(255,255,255,.12);
border:1px solid rgba(255,255,255,.2);
color:white;
outline:none;
box-sizing:border-box;
}

.input::placeholder{

color:#ddd;

}

.loginBtn{

width:100%;

padding:14px;

border-radius:14px;

font-weight:bold;

background:rgba(47,111,237,0.8);

color:white;

transition:.3s;

}

.loginBtn:hover{

background:rgba(109, 145, 216, 0.8)

}

.logo{

width:90px;

height:90px;

border-radius:50%;

background:white;

display:flex;

justify-content:center;

align-items:center;

font-size:38px;

font-weight:bold;

color:#d71920;

margin:auto;

box-shadow:0 0 25px rgba(255,255,255,.3);

}
.registerBtn{

width:100%;

padding:15px;

border:none;

border-radius:14px;

background:rgba(47,111,237,0.8);

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.registerBtn:hover{

background:rgba(109, 145, 216, 0.8)

}


</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-borderless/borderless.min.css">
</head>

<body class="flex items-center justify-center min-h-screen p-5">

<div class="glass rounded-3xl w-full max-w-md p-8">

<div class="logo">

B

</div>

<h1 class="text-center text-white text-3xl font-black mt-5">

B-Portal

</h1>

<p class="text-center text-gray-200 mt-2">

Welcome Back

</p>

<div class="mt-8">

<label class="text-white text-sm">

Mobile Number

</label>

<div class="relative mt-2">

<i class="fa fa-phone absolute left-5 top-1/2 -translate-y-1/2 text-white text-lg"></i>

<input
type="tel"
id="mobile"
class="input"
placeholder="Enter Mobile Number"
maxlength="10"
pattern="[6-9][0-9]{9}"
title="Please enter a valid 10 digit mobile number">

</div>

</div>

<div class="mt-5">

<label class="text-white text-sm">

Password

</label>

<div class="relative mt-2">

<i class="fa fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-white text-lg"></i>

<input
type="password"
id="password"
class="input pr-12"
placeholder="Enter Password"
minlength="6">
<button

type="button"

onclick="togglePassword()"

class="absolute right-4 top-1/2 -translate-y-1/2 text-white">

<i id="eye"

class="fa fa-eye">

</i>

</button>

</div>

</div>

<div class="flex justify-between mt-4 text-white text-sm">

<label>

<input type="checkbox">

Remember Me

</label>



</div>

<button
type="button"
class="registerBtn"
onclick="validateLogin()">
Login
</button>

<div class="text-center text-white mt-6">

Don't have an account?

<a href="register.html" class="font-bold text-yellow-300">
    Register
</a>

</div>

</div>


<script>

function validateLogin() {

    const mobileInput =
        document.getElementById("mobile");

    const passwordInput =
        document.getElementById("password");


    const mobile =
        mobileInput.value.trim();

    const password =
        passwordInput.value;


    // Mobile required

    if (mobile === "") {

        showError(
            "Please Enter Mobile Number"
        );

        mobileInput.focus();

        return;
    }


    // Mobile format

    if (!/^[6-9]\d{9}$/.test(mobile)) {

        showError(
            "Please enter a valid 10 digit mobile number."
        );

        mobileInput.focus();

        return;
    }


    // Password required

    if (password === "") {

        showError(
            "Please Enter Password"
        );

        passwordInput.focus();

        return;
    }


    // Password length

    if (password.length < 6) {

        showError(
            "Password must be at least 6 characters"
        );

        passwordInput.focus();

        return;
    }


    // Login API

    login();

}


function togglePassword() {

    const p =
        document.getElementById("password");

    const e =
        document.getElementById("eye");


    if (p.type === "password") {

        p.type = "text";

        e.className =
            "fa fa-eye-slash";

    } else {

        p.type = "password";

        e.className =
            "fa fa-eye";

    }

}

</script>


<script src="js/auth.js"></script>

<script src="js/toast.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="css/confirm.css">

<script src="js/confirm.js"></script></body>
</html>
