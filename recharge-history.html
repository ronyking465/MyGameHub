<script>
    fetch('/api/history')
    .then(res => res.json())
    .then(data => {
        const list = document.getElementById("historyList");
        list.innerHTML = ""; // लिस्ट खाली करें

        data.forEach(item => {
            list.innerHTML += `
            <div class="history-item">
                <div><b>Recharge</b><br><small>${item.date}</small></div>
                <div style="text-align:right;">
                    <div>₹${item.amount}</div>
                    <div class="status-success">${item.status}</div>
                </div>
            </div>`;
        });
    })
    .catch(err => console.error("Error:", err));




//===========================
// Recharge History
//===========================

// पुराने डेमो डेटा वाले कोड को हटा दें और यह लिखें:
fetch('http://localhost:3000/api/history')
    .then(response => response.json())
    .then(data => {
        let historyList = document.getElementById("historyList");
        let html = "";
        
        if (data.length === 0) {
            html = '<div class="history-item">No Recharge Found</div>';
        } else {
            data.forEach(item => {
                html += `
                <div class="history-item">
                    <div><b>Recharge</b><br><small>${item.date}</small></div>
                    <div style="text-align:right;">
                        <div style="font-weight:bold;">₹${item.amount}</div>
                        <div class="badge ${item.status.toLowerCase()}">${item.status}</div>
                    </div>
                </div>`;
            });
        }
        historyList.innerHTML = html;
    })
    .catch(error => console.error('Error loading history:', error));
