<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-borderless/borderless.min.css">
</head>

<body class="bg-gray-100 flex justify-center items-center h-screen">

<div class="bg-white shadow-xl rounded-xl p-8 w-96">

<h2 class="text-2xl font-bold text-center mb-6">
Admin Login
</h2>

<input
id="username"
type="text"
placeholder="Username"
class="w-full border rounded-lg p-3 mb-4">

<input
id="password"
type="password"
placeholder="Password"
class="w-full border rounded-lg p-3 mb-6">

<button
onclick="loginAdmin()"
class="w-full bg-blue-600 text-white rounded-lg p-3">

Login

</button>

<p
id="msg"
class="text-center mt-4 text-red-600">
</p>

</div>

<script src="admin-login.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="css/confirm.css">

<script src="js/confirm.js"></script></body>

</html>
