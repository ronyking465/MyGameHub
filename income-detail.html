*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
background:#120914;
}

body{
min-height:100vh;
padding-bottom:110px;
color:#fff;

background:
radial-gradient(circle at 50% -10%,rgba(255,212,59,.10),transparent 35%),
linear-gradient(180deg,#1d0b1a 0%,#120914 55%,#0d070d 100%);
}

.page{
width:100%;
max-width:430px;
margin:auto;
padding:12px 12px 120px;
}

.header-card{

background:linear-gradient(145deg,#673050,#35172f);

border-radius:24px;

padding:22px;

box-shadow:
0 18px 40px rgba(0,0,0,.45);

margin-bottom:18px;

position:relative;

overflow:hidden;
}

.header-card::before{

content:"";

position:absolute;

right:-60px;
top:-60px;

width:170px;
height:170px;

border-radius:50%;

background:radial-gradient(circle,
rgba(255,212,59,.15),
transparent 70%);
}

.back-btn{

color:#ffd43b;
font-size:22px;
margin-right:14px;
cursor:pointer;
}

.page-title{

font-size:32px;
font-weight:800;
line-height:1;
}

.page-sub{

margin-top:6px;
opacity:.8;
font-size:14px;
}

.balance-card{

margin-top:25px;

background:rgba(255,255,255,.06);

padding:18px;

border-radius:18px;

border:1px solid rgba(255,255,255,.08);
}

.balance-label{

font-size:14px;
opacity:.8;
}

#currentBalance{

display:block;

margin-top:8px;

font-size:38px;

font-weight:800;

color:#ffd43b;
}
.profile-card{

    position:relative;

    overflow:hidden;

    border-radius:24px;

    padding:28px 22px;

    background:
    linear-gradient(
        145deg,
        rgba(103,48,80,.95),
        rgba(53,23,47,.96)
    );

    border:1px solid rgba(255,255,255,.10);

    box-shadow:
    inset 0 1px rgba(255,255,255,.10),
    0 18px 40px rgba(0,0,0,.45);

}

.profile-card::before{

    content:"";

    position:absolute;

    top:-70px;
    right:-70px;

    width:180px;
    height:180px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(255,212,59,.18),
    transparent 70%);

}

.gold-badge{

    width:58px;
    height:58px;

    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    linear-gradient(
    145deg,
    #ffe45b,
    #d98a18);

    color:#3a2200;

    font-size:22px;

    margin-bottom:18px;

}

.profile-subtitle{
    color:#e8d6de;
    font-size:11px;
    font-weight:500;
}

.profile-title{
    margin-top:4px;
    color:#fff;
    font-size:46px;
    font-weight:800;
    line-height:1;
}
.balance-card{
    background:linear-gradient(145deg,#6a3153,#311423);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:22px;
    color:#fff;
    box-shadow:
    0 18px 35px rgba(0,0,0,.45),
    inset 0 1px rgba(255,255,255,.08);
}

.balance-title{
    color:#ffd43b;
    font-size:14px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
}

.balance-amount{
    margin-top:14px;
    font-size:34px;
    font-weight:800;
    color:#fff;
}

.balance-sub{
    margin-top:8px;
    font-size:12px;
    color:#d7c8d2;
}
.income-card{
    background:linear-gradient(145deg,#673050,#35172f);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:
        0 10px 25px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.06);
    transition:.3s;
}

.income-card:hover{
    transform:translateY(-4px);
}

.income-title{
    color:#fff;
    font-size:16px;
    font-weight:700;
}

.income-mobile{
    color:#d8d8d8;
    font-size:13px;
    margin-top:6px;
}

.income-date{
    color:#a8a8a8;
    font-size:11px;
    margin-top:8px;
}

.income-amount{
    color:#ffd43b;
    font-size:22px;
    font-weight:800;
}
/* ===== Dashboard Theme ===== */

.app-container{
    max-width:430px;
    margin:auto;
    min-height:100vh;
    background:linear-gradient(180deg,#321326 0%,#1b0d19 55%,#120811 100%);
    color:#fff;
    padding-bottom:100px;
}

.final-bottom-nav{
position:fixed!important;
left:50%!important;
bottom:0!important;
transform:translateX(-50%)!important;
width:100%!important;
max-width:430px!important;
height:82px!important;
padding:8px!important;
display:grid!important;
grid-template-columns:repeat(5,1fr)!important;
align-items:center!important;
background:rgba(30,13,28,.96)!important;
backdrop-filter:blur(18px)!important;
border-top:1px solid rgba(223,91,149,.28)!important;
border-radius:20px 20px 0 0!important;
box-shadow:0 -10px 30px rgba(0,0,0,.48)!important;
z-index:9999!important;
}

.final-bottom-nav .nav-btn{
height:66px;
background:transparent;
border:none;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:4px;
color:#c9b3c2;
font-size:10px;
font-weight:700;
transition:.25s;
cursor:pointer;
}

.final-bottom-nav .nav-btn:hover{
transform:translateY(-5px);
color:#ffd43b;
}

.final-bottom-nav .nav-btn i{
width:38px;
height:36px;
display:grid;
place-items:center;
border-radius:12px;
background:#5a2949;
color:#f5d9e7;
font-size:17px;
transition:.25s;
}

.final-bottom-nav .nav-btn:hover i{
transform:translateY(-3px) scale(1.08);
box-shadow:0 10px 20px rgba(0,0,0,.5),0 0 18px rgba(255,212,59,.18);
}

.final-bottom-nav .active-nav{
color:#ffd43b;
}

.final-bottom-nav .active-nav i{
background:#ffd43b;
color:#3a2000;
box-shadow:0 0 20px rgba(255,212,59,.48);
}

.final-bottom-nav .game-nav i{
width:54px;
height:54px;
margin-top:-22px;
border-radius:18px;
background:linear-gradient(145deg,#ffe45b,#d38a1b);
color:#3a2000;
font-size:23px;
}

.final-bottom-nav .game-nav:hover{
transform:translateY(-8px);
}

.final-bottom-nav .game-nav:hover i{
transform:translateY(-4px) scale(1.12) rotate(-4deg);
}


.income-card{
    background:linear-gradient(145deg,#673050,#35172f);
    border-radius:20px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 14px 28px rgba(0,0,0,.45);
    transition:.25s;
}

.income-card:hover{
    transform:translateY(-4px);
}
.income-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:18px 16px;
}

.income-tab{

    height:58px;
    border:none;
    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:15px;
    font-weight:600;
    letter-spacing:.2px;

    color:#f4edf3;

    background:linear-gradient(
        145deg,
        #673050,
        #35172f
    );

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        inset 0 1px rgba(255,255,255,.08),
        0 8px 18px rgba(0,0,0,.35);

    transition:.25s;
}

.income-tab.active{
    background:linear-gradient(180deg,#ffd95c,#d88a17);
    color:#2d1800;
}

.income-tab:hover{

    transform:translateY(-3px);

    color:#ffffff;

}

.income-tab.active-income{

    background:linear-gradient(
        145deg,
        #ffe45b,
        #d98a18
    );

    color:#2b1600 !important;

    font-weight:700;

    box-shadow:
        0 5px 0 #9b5f12,
        0 10px 18px rgba(0,0,0,.45),
        0 0 16px rgba(255,212,59,.35);

}

.income-tab.active-income:hover{
    color:#000 !important;
}
.page-header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px;
}

.back-btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    background:linear-gradient(145deg,#5b2745,#472039);
    color:#ffd43b;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 18px rgba(0,0,0,.35);
    transition:.25s;
}

.back-btn:hover{
    transform:translateY(-3px);
}

.page-title{
    color:#fff;
    font-size:18px;
    font-weight:800;
}

.page-subtitle{
    color:#d9c7d3;
    font-size:13px;
}

</style>

<body class="dashboard-body">
<div class="app-container">
    <div class="page-header">

    <button class="back-btn" onclick="goBackMy()">
        <i class="fas fa-arrow-left"></i>
    </button>

    <div>
        <h2 class="page-title">Income Details</h2>
        <p class="page-subtitle">Manage your income history</p>
    </div>

</div>

<div class="p-4">

    <div class="profile-card">

        <div class="gold-badge">
            <i class="fas fa-wallet"></i>
        </div>

        <div class="profile-content">

            <p class="profile-subtitle">
                Current Balance
            </p>

            <h1 id="currentBalance" class="profile-title">
                ₹0.00
            </h1>

        </div>

    </div>

</div>

<!-- ============== CURRENT BALANCE ============== -->


<!-- ================= INCOME TABS ================= -->

<div class="px-4 pb-4">

    <div class="grid grid-cols-2 gap-3">

        <button
            id="myIncomeTab"
            onclick="showMyIncome()"
            class="income-tab active-income">
            My Income
        </button>

        <button
            id="subIncomeTab"
            onclick="showSubIncome()"
            class="income-tab">
            Subordinate Income
        </button>

    </div>

</div>
<!-- ================= MY INCOME ================= -->

<div id="myIncomeSection" class="px-4">
   <div id="incomeList"></div>

</div>

    

<!-- ================= SUBORDINATE INCOME ================= -->

<div id="subIncomeSection" class="px-4 hidden">

    <div id="subIncomeList"></div>

</div>
<!-- Bottom Navigation -->

<div class="final-bottom-nav">

    <button id="homeNav" class="nav-btn" onclick="goDashboard()">
        <i class="fas fa-house"></i>
        <span>Plan</span>
    </button>

    <button id="shareNav" class="nav-btn" onclick="goShare()">
        <i class="fas fa-arrows-rotate"></i>
        <span>Convert</span>
    </button>

        <button id="gameNav" class="nav-btn game-nav" onclick="goCard()">
    <i class="fas fa-credit-card"></i>
    <span>Card</span>
     </button>

    <button id="teamNav" class="nav-btn" onclick="goTeam()">
        <i class="fas fa-users"></i>
        <span>Team</span>
    </button>

    <button id="myNav" class="nav-btn active-nav" onclick="goMy()">
        <i class="fas fa-user"></i>
        <span>My</span>
    </button>

</div>

<div class="h-20"></div>

<!-- Next Part Here -->

</div>
</div>

<script>
    function goBackMy(){
    window.location.href = "my.html";
}


function showMyIncome(){

    document.getElementById("myIncomeSection").classList.remove("hidden");
    document.getElementById("subIncomeSection").classList.add("hidden");

   document.getElementById("myIncomeTab").className =
"income-tab active-income";

document.getElementById("subIncomeTab").className =
"income-tab";

}

function showSubIncome(){

    document.getElementById("myIncomeSection").classList.add("hidden");
    document.getElementById("subIncomeSection").classList.remove("hidden");

   document.getElementById("subIncomeTab").className =
"income-tab active-income";

document.getElementById("myIncomeTab").className =
"income-tab";

}

window.onload = function () {
    showMyIncome();
};
localStorage.setItem("activeNav", "my");
updateActiveNav();

</script>
