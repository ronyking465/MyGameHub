<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f3f4f6;
}

.activeTab{
background:#2563eb;
color:#fff;
}


.record-card{
background:#fff;
border-radius:16px;
padding:16px;
margin-top:14px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.status{
padding:4px 12px;
border-radius:50px;
font-size:12px;
font-weight:600;
}

.pending{
    background:#5b4710;
    color:#ffd43b;
    border:1px solid #ffd43b;
}

.success{
background:#dcfce7;
color:#16a34a;
}

.failed{
background:#fee2e2;
color:#dc2626;
}
.records-container{
    height:calc(100vh - 190px);
    overflow-y:auto;
    padding-bottom:90px;
}

.tabs-sticky{
    position:sticky;
    top:56px;       /* Header ki height */
    z-index:40;
    background:#fff;
}
/* Recharge / Withdraw Tabs */

#rechargeTab,
#withdrawTab {
    border: 2px solid #2563eb;
    background: #ffffff;
    color: #111827;
    transition: all 0.25s ease;
    cursor: pointer;
}

/* Card.html jaisa selected effect */
#rechargeTab.activeTab,
#withdrawTab.activeTab {
    background: #2563eb;
    color: #ffffff;
    border-color: #2563eb;
    box-shadow: 0 4px 12px rgba(47, 111, 237, 0.2);
    transform: translateY(-1px);
}

/* Click effect */
#rechargeTab:active,
#withdrawTab:active {
    transform: scale(0.97);
}

/* Hover effect */
#rechargeTab:hover,
#withdrawTab:hover {
    transform: translateY(-2px);
}


.activeTab{
    background:#2563eb;
    color:#fff;
}
.hide {
    display: none !important;
}
.activeTab{
    background:#2563eb !important;
    color:#fff !important;
    border-color:#2563eb !important;
}


#rechargeTab.activeTab,
#withdrawTab.activeTab{
    background:#2563eb;
    color:#fff;
}
body{
    background:
    radial-gradient(circle at 50% -10%,rgba(255,212,59,.10),transparent 35%),
    linear-gradient(180deg,#1d0b1a 0%,#120914 55%,#0d070d 100%);
    color:#fff;
}

.max-w-xl{
    max-width:430px!important;
    background:transparent!important;
}

/* Header */
.bg-blue-600{
    background:linear-gradient(145deg,#673050,#35172f)!important;
    border-bottom:1px solid rgba(255,255,255,.08);
    box-shadow:0 10px 25px rgba(0,0,0,.35);
}

/* Sticky Tabs */
.tabs-sticky{
    background:transparent!important;
    backdrop-filter:blur(10px);
}

/* Tabs */
#rechargeTab,
#withdrawTab{
    height:56px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.08)!important;
    background:#4f2441!important;
    color:#fff!important;
    font-weight:700;
    transition:.25s;
}

#rechargeTab.activeTab,
#withdrawTab.activeTab{
    background:linear-gradient(145deg,#ffe45b,#d98a18)!important;
    color:#000!important;
    border-color:#ffe45b!important;
    box-shadow:
        0 0 20px rgba(255,212,59,.35),
        inset 0 2px rgba(255,255,255,.4);
}

/* Cards */
.record-card{
    background:linear-gradient(145deg,#673050,#35172f)!important;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:
        0 14px 28px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.05);
    color:#fff;
}

.record-card h3{
    color:#fff;
    font-size:17px;
    font-weight:700;
}

.record-card p{
    color:#d6c9d1!important;
}

.record-card .text-gray-600{
    color:#d6c9d1!important;
}

.record-card .font-bold{
    color:#ffd43b!important;
}

/* Status */
.pending{
    background:#5b4710;
    color:#ffd43b;
    border:1px solid #ffd43b;
}

.success{
    background:#183c28;
    color:#6dff9a;
}

.failed{
    background:#4a1f25;
    color:#ff8d8d;
}

/* Scroll */
.records-container{
    background:transparent;
}

.records-container::-webkit-scrollbar{
    display:none;
}
.back-btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    background:linear-gradient(145deg,#5b2745,#472039);
    color:#ffd43b;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 18px rgba(0,0,0,.35);
    transition:.25s;
}

.back-btn:hover{
    transform:translateY(-3px);
}
.final-bottom-nav{
position:fixed!important;
left:50%!important;
bottom:0!important;
transform:translateX(-50%)!important;
width:100%!important;
max-width:430px!important;
height:82px!important;
padding:8px!important;
display:grid!important;
grid-template-columns:repeat(5,1fr)!important;
align-items:center!important;
background:rgba(30,13,28,.96)!important;
backdrop-filter:blur(18px)!important;
border-top:1px solid rgba(223,91,149,.28)!important;
border-radius:20px 20px 0 0!important;
box-shadow:0 -10px 30px rgba(0,0,0,.48)!important;
z-index:9999!important;
}

.final-bottom-nav .nav-btn{
height:66px;
background:transparent;
border:none;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:4px;
color:#c9b3c2;
font-size:10px;
font-weight:700;

.final-bottom-nav .nav-btn:hover{
transform:translateY(-5px);
color:#ffd43b;
}

.final-bottom-nav .nav-btn i{
width:38px;
height:36px;
display:grid;
place-items:center;
border-radius:12px;

.final-bottom-nav .nav-btn:hover i{

.final-bottom-nav .active-nav{

}

.final-bottom-nav .active-nav i{

}

.final-bottom-nav .game-nav:hover{

}

.final-bottom-nav .game-nav:hover i{

<body>
    

<div class="max-w-xl mx-auto min-h-screen bg-gray-100">
    

<!-- Header -->

<div class="bg-blue-600 h-14 flex items-center px-4 sticky top-0 z-50">
    

    <button class="back-btn" onclick="goBackMy()">
        <i class="fas fa-arrow-left"></i>

    </h2>

</div>

<!-- Tabs -->

<div class="records-container">

    <div
        id="rechargeList"
        class="hide p-4">

    <div
        id="withdrawList"
        class="hide p-4">
    </div>

</div>



<!-- Bottom Navigation -->
<div class="final-bottom-nav">

    <button id="homeNav" class="nav-btn" onclick="goDashboard()">
        <i class="fas fa-house"></i>
        <span>Plan</span>
    </button>

    <button id="shareNav" class="nav-btn" onclick="goShare()">
        <i class="fas fa-arrows-rotate"></i>
        <span>Convert</span>
    </button>

       <button id="gameNav" class="nav-btn game-nav" onclick="goCard()">
    <i class="fas fa-credit-card"></i>
    <span>Card</span>
     </button>
    
     <button id="teamNav" class="nav-btn" onclick="goTeam()">
        <i class="fas fa-users"></i>
        <span>Team</span>
    </button>

</div>



<div class="h-20"></div>

<script>
    const token = localStorage.getItem("token");

if (!token) {
    showPopup("Please Login First");
    window.location.href = "login.html";
}
    function goBackMy(){
    window.location.href = "my.html";
}

// Elements
const rechargeTab = document.getElementById("rechargeTab");
const withdrawTab = document.getElementById("withdrawTab");

const rechargeList = document.getElementById("rechargeList");
const withdrawList = document.getElementById("withdrawList");

const pageTitle = document.getElementById("pageTitle");
async function loadRechargeHistory(){

    const res = await fetch(
        "/api/recharge/history",
        {
            headers:{
                Authorization:"Bearer "+token
            }
        }
    );

    const data = await res.json();

    rechargeList.innerHTML="";

    if(data.history.length===0){

        rechargeList.innerHTML=
        "<p class='text-center mt-10 text-gray-500'>No Recharge History</p>";

        return;
    }

    data.history.forEach(item=>{

        let cls="pending";

        if(item.status==="Approved") cls="success";

        if(item.status==="Rejected") cls="failed";

       rechargeList.innerHTML += `

<div class="record-card">

    <div class="flex justify-between items-start">

        <div>

            <h3 class="font-semibold text-lg">
                Recharge
            </h3>

            <p class="text-xs text-gray-500">
                ${new Date(item.createdAt).toLocaleString()}
            </p>

            <p class="text-xs text-gray-500 mt-1">
                Order No :
                <span class="font-semibold text-blue-600">
                    ${item.orderNo || "-"}
                </span>
            </p>

            <p class="text-xs text-gray-500 mt-1">
                UTR :
                <span class="font-semibold">
                   ${item.utr || "-"}
                </span>
            </p>

        </div>

        <span class="status ${cls}">
            ${item.status}
        </span>

    </div>

    <div class="mt-5 flex justify-between">

        <span class="text-gray-600">
            Amount
        </span>

        <span class="font-bold text-xl">
            ₹${item.amount}
        </span>

    </div>

</div>

`;

    });

}
async function loadWithdrawHistory(){

    const res = await fetch(
        "/api/withdraw/history",
        {
            headers:{
                Authorization:"Bearer "+token
            }
        }
    );

    const data = await res.json();

    withdrawList.innerHTML="";

    if(data.history.length===0){

        withdrawList.innerHTML=
        "<p class='text-center mt-10 text-gray-500'>No Withdraw History</p>";

        return;
    }

    data.history.forEach(item=>{

        let cls="pending";

        if(item.status==="Approved") cls="success";

        if(item.status==="Rejected") cls="failed";

       withdrawList.innerHTML += `

<div class="record-card">

    <div class="flex justify-between items-start">

        <div>

            <h3 class="font-semibold text-lg">
                Withdrawal
            </h3>

            <p class="text-xs text-gray-500">
                ${new Date(item.createdAt).toLocaleString()}
            </p>

            <p class="text-xs text-gray-500 mt-1">
                Order No :
                <span class="font-semibold text-blue-600">
                    ${item.orderNo || "-"}
                </span>
            </p>

            <p class="text-xs text-gray-500 mt-1">
                Bank :
                <span class="font-semibold">
                    ${item.bankName || "-"}
                </span>
            </p>

        </div>

        <span class="status ${cls}">
            ${item.status}
        </span>

    </div>

    <div class="mt-5 flex justify-between">

        <span class="text-gray-600">
            Amount
        </span>

        <span class="font-bold text-xl">
            ₹${item.amount}
        </span>

    </div>

    ${
        item.status === "Rejected" && item.rejectReason
        ? `
        <div class="mt-3 text-sm text-red-600">
            <b>Reason :</b> ${item.rejectReason}
        </div>
        `
        : ""
    }

</div>

`;
    });

}

// ==========================================
// FINAL RECORD TAB SYSTEM
// ==========================================

// ==========================================
// RECORD TAB SYSTEM
// ==========================================

function setRecordTab(type, updateUrl = false) {

    // Pehle dono inactive
    rechargeTab.classList.remove("activeTab");
    withdrawTab.classList.remove("activeTab");

    // Dono list hide
    rechargeList.classList.add("hide");
    withdrawList.classList.add("hide");


    if (type === "withdraw") {

        // Withdraw active
        withdrawTab.classList.add("activeTab");

        // Withdraw list show
        withdrawList.classList.remove("hide");

        if (updateUrl) {
            history.replaceState(
                null,
                "",
                "record.html?type=withdraw"
            );
        }

    } else {

        // Recharge active
        rechargeTab.classList.add("activeTab");

        // Recharge list show
        rechargeList.classList.remove("hide");

        if (updateUrl) {
            history.replaceState(
                null,
                "",
                "record.html?type=recharge"
            );
        }

    }

}


// ==========================================
// RECHARGE CLICK
// ==========================================

function showRecharge() {

    setRecordTab("recharge", true);

}


// ==========================================
// WITHDRAW CLICK
// ==========================================

function showWithdraw() {

    setRecordTab("withdraw", true);

}


// ==========================================
// PAGE LOAD
// ==========================================

// Script body ke end me hai,
// isliye DOM already available hai.

const recordParams =
    new URLSearchParams(window.location.search);

const recordType =
    recordParams.get("type") === "withdraw"
        ? "withdraw"
        : "recharge";


// URL ke according TAB TURANT select
// History load ka wait nahi karega

setRecordTab(recordType, false);


// ==========================================
// HISTORY LOAD
// ==========================================

Promise.all([
    loadRechargeHistory(),
    loadWithdrawHistory()
]).catch(error => {

    console.error(
        "History Load Error:",
        error
    );

});
</script>
