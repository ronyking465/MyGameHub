<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Device</title>
<link rel="stylesheet" href="css/toast.css">

<script src="js/authGuard.js"></script>
<script src="js/navigation.js"></script>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:
radial-gradient(circle at top,#3a1748 0%,#1b0b22 45%,#120914 100%);

color:#fff;

min-height:100vh;

padding-bottom:110px;

}

.device-page{

width:100%;

max-width:430px;

margin:auto;

padding:14px;

}
.profile-card{

padding:22px;

border-radius:24px;

background:
linear-gradient(
145deg,
rgba(103,48,80,.96),
rgba(53,23,47,.96)
);

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 18px 40px rgba(0,0,0,.45);

margin-bottom:18px;

color:#fff;

}

.device-card{

    background:
    linear-gradient(
        145deg,
        rgba(103,48,80,.96),
        rgba(53,23,47,.96)
    );

    border:1px solid rgba(255,255,255,.08);

    border-radius:22px;

    padding:18px;

    margin-bottom:16px;

    color:#fff;

    box-shadow:
    0 15px 30px rgba(0,0,0,.35);

    transition:.25s;
}

.device-card:hover{

    transform:translateY(-5px);

    box-shadow:
    0 20px 40px rgba(0,0,0,.5),
    0 0 20px rgba(255,212,59,.12);
}

.device-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;
}

.device-title{

    font-size:22px;

    font-weight:800;

    color:#fff;
}

.device-income{

    margin-top:6px;

    color:#ffd43b;

    font-size:14px;
}

.device-status{

    background:linear-gradient(145deg,#ffe45b,#d98a18);

    color:#351900;

    padding:6px 14px;

    border-radius:999px;

    font-size:12px;

    font-weight:700;
}

.device-info{

    display:flex;

    justify-content:space-between;

    margin-top:18px;

    color:#d9bfd1;

    font-size:13px;
}

.device-progress{

    margin-top:10px;

    height:9px;

    border-radius:20px;

    overflow:hidden;

    background:rgba(255,255,255,.10);
}

.device-progress-fill{

    height:100%;

    border-radius:20px;

    background:
    linear-gradient(90deg,#ffe45b,#ffb400);

    box-shadow:
    0 0 12px rgba(255,212,59,.45);

    transition:.5s;
}

.device-date{

    margin-top:16px;

    font-size:13px;

    color:#d8bfd0;
}

.device-date i{

    color:#ffd43b;

    margin-right:6px;
}
/* =========================================
   DASHBOARD BOTTOM NAV
========================================= */

.final-bottom-nav{

    position:fixed!important;
    left:50%!important;
    bottom:0!important;

    transform:translateX(-50%)!important;

    width:100%!important;
    max-width:430px!important;

    height:82px!important;

    padding:8px!important;

    display:grid!important;
    grid-template-columns:repeat(5,1fr)!important;

    align-items:center!important;

    z-index:99999!important;

    background:rgba(30,13,28,.96)!important;

    backdrop-filter:blur(18px)!important;

    border-top:1px solid rgba(223,91,149,.28)!important;

    box-shadow:
    0 -10px 30px rgba(0,0,0,.48)!important;

    border-radius:20px 20px 0 0!important;
}


/* ========================= */

.final-bottom-nav .nav-btn{

    border:none!important;

    background:transparent!important;

    height:66px!important;

    display:flex!important;

    flex-direction:column!important;

    justify-content:center!important;

    align-items:center!important;

    gap:4px!important;

    color:#c9b3c2!important;

    font-size:10px!important;

    font-weight:700!important;

    cursor:pointer;

    transition:
    transform .25s ease,
    color .25s ease!important;
}


/* Hover */

.final-bottom-nav .nav-btn:hover{

    transform:translateY(-5px)!important;

    color:#ffd43b!important;
}


/* Icon */

.final-bottom-nav .nav-btn i{

    width:38px!important;

    height:36px!important;

    display:grid!important;

    place-items:center!important;

    border-radius:12px!important;

    background:#5a2949!important;

    color:#f5d9e7!important;

    font-size:17px!important;

    transition:
    transform .25s ease,
    box-shadow .25s ease!important;

    box-shadow:
    inset 0 1px rgba(255,255,255,.08),
    0 5px 12px rgba(0,0,0,.35)!important;
}


/* Hover Icon */

.final-bottom-nav .nav-btn:hover i{

    transform:
    translateY(-3px)
    scale(1.08)!important;

    box-shadow:
    0 10px 20px rgba(0,0,0,.5),
    0 0 18px rgba(255,212,59,.18)!important;
}


/* Active */

.final-bottom-nav .nav-btn.active-nav{

    color:#ffd43b!important;
}

.final-bottom-nav .nav-btn.active-nav i{

    background:#ffd43b!important;

    color:#3a2000!important;

    box-shadow:
    0 0 20px rgba(255,212,59,.48),
    0 7px 15px rgba(0,0,0,.35)!important;
}


/* =========================
   GAME BUTTON
========================= */

.final-bottom-nav .game-nav{

    color:#ffd43b!important;
}

.final-bottom-nav .game-nav i{

    width:54px!important;

    height:54px!important;

    margin-top:-22px!important;

    border-radius:18px!important;

    background:
    linear-gradient(145deg,#ffe45b,#d38a1b)!important;

    color:#3a2000!important;

    font-size:23px!important;

    box-shadow:
    inset 0 2px rgba(255,255,255,.55),
    0 10px 20px rgba(0,0,0,.55),
    0 0 25px rgba(255,208,45,.32)!important;
}

.final-bottom-nav .game-nav:hover{

    transform:translateY(-8px)!important;
}

.final-bottom-nav .game-nav:hover i{

    transform:
    translateY(-4px)
    scale(1.12)
    rotate(-4deg)!important;
}


/* ========================= */

@media(max-width:360px){

.final-bottom-nav .nav-btn span{

font-size:9px!important;

}

}
.back-btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    background:linear-gradient(145deg,#5b2745,#472039);
    color:#ffd43b;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 18px rgba(0,0,0,.35);
    transition:.25s;
}

.back-btn:hover{
    transform:translateY(-3px);
}
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-borderless/borderless.min.css">
</head>

<body>

<div class="device-page">

<!-- Header -->

<div class="device-page">

<div class="profile-card">

<div class="flex items-center">

<button class="back-btn" onclick="goBackMy()">
        <i class="fas fa-arrow-left"></i>
    </button>
<div>

<h2 style="font-size:24px;font-weight:800;">
My Devices
</h2>

<p style="font-size:13px;color:#d6bfd3;">
Purchased Products
</p>

</div>

</div>

<div style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;">

<div>

<div style="font-size:13px;color:#d5bfd3;">
Total Products
</div>

<div
id="deviceCount"
style="font-size:42px;font-weight:800;color:#ffd43b;">
0
</div>

</div>

<div style="
width:70px;
height:70px;
border-radius:18px;
background:linear-gradient(145deg,#ffe45b,#d98a18);
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:#351900;
box-shadow:0 10px 20px rgba(0,0,0,.45);
">

<i class="fas fa-mobile-screen-button"></i>

</div>

</div>

</div>
<!-- Product List -->

<div id="deviceList" class="p-4 space-y-4">

</div>

<!-- Empty -->

<div
id="emptyDevice"
class="hidden flex-col items-center justify-center pt-24">

<i class="fas fa-box-open text-7xl text-gray-300"></i>

<p class="mt-5 text-gray-500 text-lg">

No Product Purchased

</p>

</div>

<!-- Bottom Navigation -->

<div class="final-bottom-nav">

    <button id="homeNav" class="nav-btn" onclick="goDashboard()">
        <i class="fas fa-house"></i>
        <span>Plan</span>
    </button>

    <button id="shareNav" class="nav-btn" onclick="goShare()">
        <i class="fas fa-arrows-rotate"></i>
        <span>Convert</span>
    </button>

     <button id="gameNav" class="nav-btn game-nav" onclick="goCard()">
    <i class="fas fa-credit-card"></i>
    <span>Card</span>
     </button>

    <button id="teamNav" class="nav-btn" onclick="goTeam()">
        <i class="fas fa-users"></i>
        <span>Team</span>
    </button>

    <button id="myNav" class="nav-btn active-nav" onclick="goMy()">
        <i class="fas fa-user"></i>
        <span>My</span>
    </button>

</div>


<div class="h-20"></div>
<div style="height:95px;"></div>
<script>   function goBackMy(){
    window.location.href = "my.html";
}
localStorage.setItem("activeNav", "my");
updateActiveNav();</script>
<script src="js/toast.js"></script>


<script src="js/device.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="css/confirm.css">

<script src="js/confirm.js"></script></body>
</html>
