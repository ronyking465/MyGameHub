<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/toast.css">
    <script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-borderless/borderless.min.css">
</head>

<body class="bg-gray-100">

<div class="max-w-xl mx-auto p-5">

    <div class="bg-white rounded-xl shadow p-6">

        <h2 class="text-2xl font-bold mb-5">
            User Details
        </h2>

        <p><b>Name :</b> <span id="name"></span></p>

        <p><b>Mobile :</b> <span id="mobile"></span></p>

        <p><b>Balance :</b> ₹<span id="balance"></span></p>

        <p><b>VIP :</b> <span id="vip"></span></p>

        <p><b>Total Recharge :</b> ₹<span id="recharge"></span></p>

        <p><b>Total Withdraw :</b> ₹<span id="withdraw"></span></p>

        <p><b>Total Income :</b> ₹<span id="income"></span></p>

        <p><b>Total Team :</b> <span id="team"></span></p>

    </div>
   <div class="grid grid-cols-6 gap-3 mt-6">

    <button
        onclick="addBalance()"
        class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg">

        Add Balance

    </button>

    <button
        onclick="deductBalance()"
        class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg">

        Deduct Balance

    </button>

    <button
        onclick="changeVip()"
        class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg">

        Change VIP

    </button>

    <button
        onclick="blockUser()"
        class="bg-yellow-500 hover:bg-yellow-600 text-white px-5 py-2 rounded-lg">

        Block

    </button>

    <button
        onclick="unblockUser()"
        class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg">

        Unblock

    </button>
      <button
        onclick="goBack()"
        class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg">

        back

    </button>

</div>


</div>

<script src="js/user-details.js"></script>
<script src="js/toast.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="css/confirm.css">

<script src="js/confirm.js"></script></body>

</html>
