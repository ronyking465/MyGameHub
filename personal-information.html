<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Personal Information</title>
<link rel="stylesheet" href="css/toast.css">

<script src="js/authGuard.js"></script>
<script src="js/navigation.js"></script>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="css/confirm.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
background:#120914;
}

body{

background:
radial-gradient(circle at top,
rgba(255,212,59,.08),
transparent 35%),
linear-gradient(
180deg,
#1d0b1a,
#120914);

color:#fff;

padding-bottom:110px;

}

.page{

max-width:430px;

margin:auto;

min-height:100vh;

padding:16px;

}

.header{

display:flex;

align-items:center;

gap:14px;

margin-bottom:20px;

}

.back-btn{

width:42px;
height:42px;

border:none;

border-radius:14px;

background:#5a2949;

color:#ffd43b;

font-size:18px;

cursor:pointer;

transition:.25s;

}

.back-btn:hover{

transform:translateY(-3px);

}

.header-text{

flex:1;

}

.header-text h2{

font-size:22px;

font-weight:800;

}

.header-text p{

font-size:12px;

color:#d8bdd1;

margin-top:2px;

}

.logo-card{

margin-top:18px;

background:
linear-gradient(
145deg,
#673050,
#35172f);

border-radius:24px;

padding:30px;

text-align:center;

box-shadow:
0 20px 40px rgba(0,0,0,.45);

border:1px solid rgba(255,255,255,.08);

}

.logo-card img{

width:170px;

margin:auto;

}

.section-title{

margin-top:26px;

margin-bottom:14px;

font-size:13px;

font-weight:800;

letter-spacing:.6px;

color:#ffd43b;

text-transform:uppercase;

}

.menu-list{

display:flex;

flex-direction:column;

gap:14px;

}

.menu-card{

display:flex;

justify-content:space-between;

align-items:center;

padding:18px;

border-radius:18px;

cursor:pointer;

background:
linear-gradient(
145deg,
#673050,
#35172f);

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 12px 25px rgba(0,0,0,.35);

transition:.25s;

}

.menu-card:hover{

transform:translateY(-4px);

box-shadow:
0 18px 30px rgba(0,0,0,.45);

}

.menu-left{

display:flex;

align-items:center;

gap:15px;

}

.menu-icon{

width:48px;

height:48px;

border-radius:15px;

display:flex;

align-items:center;

justify-content:center;

background:#ffd43b;

color:#3a2000;

font-size:20px;

}

.menu-info h3{

font-size:15px;

font-weight:700;

}

.menu-info p{

margin-top:3px;

font-size:11px;

color:#d5bccc;

}

.menu-arrow{

color:#ffd43b;

font-size:15px;

}
.final-bottom-nav{
position:fixed!important;
left:50%!important;
bottom:0!important;
transform:translateX(-50%)!important;
width:100%!important;
max-width:430px!important;
height:82px!important;
padding:8px!important;
display:grid!important;
grid-template-columns:repeat(5,1fr)!important;
align-items:center!important;
background:rgba(30,13,28,.96)!important;
backdrop-filter:blur(18px)!important;
border-top:1px solid rgba(223,91,149,.28)!important;
border-radius:20px 20px 0 0!important;
box-shadow:0 -10px 30px rgba(0,0,0,.48)!important;
z-index:9999!important;
}

.final-bottom-nav .nav-btn{
height:66px;
background:transparent;
border:none;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:4px;
color:#c9b3c2;
font-size:10px;
font-weight:700;
transition:.25s;
cursor:pointer;
}

.final-bottom-nav .nav-btn:hover{
transform:translateY(-5px);
color:#ffd43b;
}

.final-bottom-nav .nav-btn i{
width:38px;
height:36px;
display:grid;
place-items:center;
border-radius:12px;
background:#5a2949;
color:#f5d9e7;
font-size:17px;
transition:.25s;
}

.final-bottom-nav .nav-btn:hover i{
transform:translateY(-3px) scale(1.08);
box-shadow:0 10px 20px rgba(0,0,0,.5),0 0 18px rgba(255,212,59,.18);
}

.final-bottom-nav .active-nav{
color:#ffd43b;
}

.final-bottom-nav .active-nav i{
background:#ffd43b;
color:#3a2000;
box-shadow:0 0 20px rgba(255,212,59,.48);
}

.final-bottom-nav .game-nav i{
width:54px;
height:54px;
margin-top:-22px;
border-radius:18px;
background:linear-gradient(145deg,#ffe45b,#d38a1b);
color:#3a2000;
font-size:23px;
}

.final-bottom-nav .game-nav:hover{
transform:translateY(-8px);
}

.final-bottom-nav .game-nav:hover i{
transform:translateY(-4px) scale(1.12) rotate(-4deg);
}

</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-borderless/borderless.min.css">
</head>

<body>

<div class="page">

<div class="header">

<button class="back-btn"
onclick="location.href='my.html'">

<i class="fas fa-arrow-left"></i>

</button>

<div class="header-text">

<h2>Personal Information</h2>

<p>Manage your account securely</p>

</div>

</div>

<div class="logo-card">

<img
    src="logo.png"
    alt="Logo"
    class="w-40 mx-auto"
    onerror="this.src='https://dummyimage.com/300x120/5a2949/ffd43b&text=BRITANNIYA';">
</div>

<div class="section-title">

Account Settings

</div>

<div class="menu-list">
    <div class="menu-card"
onclick="location.href='card.html?tab=withdraw&bind=true'">

    <div class="menu-left">

        <div class="menu-icon">
            <i class="fas fa-ranking-star"></i>
        </div>

        <div class="menu-info">

            <h3>Add Bank Card</h3>

            <p>Bind your withdrawal bank account</p>

        </div>

    </div>

    <i class="fas fa-chevron-right menu-arrow"></i>

</div>



<div class="menu-card"
onclick="location.href='forgot-login-password.html'">

    <div class="menu-left">

        <div class="menu-icon">
            <i class="fas fa-lock"></i>
        </div>

        <div class="menu-info">

            <h3>Change Password</h3>

            <p>Update your login password</p>

        </div>

    </div>

    <i class="fas fa-chevron-right menu-arrow"></i>

</div>



<div class="menu-card"
onclick="location.href='forgot-withdraw-password.html'">

    <div class="menu-left">

        <div class="menu-icon">
            <i class="fas fa-shield-alt"></i>
        </div>

        <div class="menu-info">

            <h3>Withdrawal Password</h3>

            <p>Protect your withdrawal account</p>

        </div>

    </div>

    <i class="fas fa-chevron-right menu-arrow"></i>

</div>

</div>
<!-- Bottom Navigation -->

<div class="final-bottom-nav">

<button id="homeNav"
class="nav-btn"
onclick="goDashboard()">

<i class="fas fa-house"></i>

<span>Plan</span>

</button>


<button id="shareNav"
class="nav-btn"
onclick="goShare()">

<i class="fas fa-arrows-rotate"></i>

<span>Convert</span>

</button>


     <button id="gameNav" class="nav-btn game-nav" onclick="goCard()">
    <i class="fas fa-credit-card"></i>
    <span>Card</span>
     </button>


<button id="teamNav"
class="nav-btn"
onclick="goTeam()">

<i class="fas fa-users"></i>

<span>Team</span>

</button>


<button id="myNav"
class="nav-btn active-nav"
onclick="goMy()">

<i class="fas fa-user"></i>

<span>My</span>

</button>

</div>

<div style="height:95px"></div>

<script>
localStorage.setItem("activeNav", "my");
updateActiveNav();
</script>
<script src="js/authGuard.js"></script>
<script src="js/toast.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<script src="js/confirm.js"></script>
</body>
</html>
