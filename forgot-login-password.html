<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Login Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .box {
            width: 92%;
            max-width: 420px;
            background: #fff;
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.10);
        }

        h2 {
            text-align: center;
            margin: 0 0 8px;
        }

        .sub {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            line-height: 1.5;
            font-size: 14px;
        }

        .group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #555;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #333;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Forgot Login Password</h2>

    <div class="sub">
        Enter your mobile number and withdraw PIN
        to create a new login password.
    </div>
<div class="group">
    <label>Mobile Number</label>

    <input
        id="mobile"
        type="tel"
        maxlength="10"
        placeholder="Enter mobile number"
    >
</div>

<div class="group">
    <label>Current Login Password</label>

    <input
        id="currentPassword"
        type="password"
        placeholder="Enter current login password"
    >
</div>

<div class="group">
    <label>New Login Password</label>

    <input
        id="newPassword"
        type="password"
        placeholder="Enter new login password"
    >
</div>

<div class="group">
    <label>Confirm New Login Password</label>

    <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm new login password"
    >
</div>

<button id="resetBtn">
    Reset Login Password
</button>

    <div
        id="message"
        class="message"
    ></div>


    <a
        href="login.html"
        class="back"
    >
        ← Back to Login
    </a>

</div>


<script>

"use strict";

const API =
    "/api/auth";


const mobile =
    document.getElementById("mobile");

const currentPassword =
    document.getElementById("currentPassword");

const newPassword =
    document.getElementById("newPassword");

const confirmPassword =
    document.getElementById("confirmPassword");

const resetBtn =
    document.getElementById("resetBtn");

const message =
    document.getElementById("message");


function showMessage(text, error = false) {

    message.textContent = text;

    message.style.color =
        error ? "#d00000" : "#16803c";

}


resetBtn.addEventListener(
    "click",
    async function () {

        const mobileValue =
            mobile.value.trim();

        const currentValue =
            currentPassword.value;

        const newValue =
            newPassword.value;

        const confirmValue =
            confirmPassword.value;


        // =========================
        // Mobile validation
        // =========================

        if (!/^[6-9]\d{9}$/.test(mobileValue)) {

            showMessage(
                "Enter a valid 10 digit mobile number.",
                true
            );

            return;
        }


        // =========================
        // Current login password
        // =========================

        if (!currentValue) {

            showMessage(
                "Enter your current login password.",
                true
            );

            return;
        }


        // =========================
        // New password
        // =========================

        if (newValue.length < 6) {

            showMessage(
                "New password must be at least 6 characters.",
                true
            );

            return;
        }


        // =========================
        // Confirm password
        // =========================

        if (newValue !== confirmValue) {

            showMessage(
                "New passwords do not match.",
                true
            );

            return;
        }


        resetBtn.disabled = true;

        resetBtn.textContent =
            "Resetting...";

        showMessage("");


        try {

            const response =
                await fetch(
                    API + "/reset-login-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                mobile:
                                    mobileValue,

                                currentPassword:
                                    currentValue,

                                newPassword:
                                    newValue

                            })
                    }
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                showMessage(
                    data.message ||
                    "Password reset failed.",
                    true
                );

                resetBtn.disabled = false;

                resetBtn.textContent =
                    "Reset Login Password";

                return;
            }


            showMessage(
                "Login password changed successfully."
            );


            resetBtn.textContent =
                "Success";


            setTimeout(
                function () {

                    window.location.href =
                        "login.html";

                },
                1500
            );


        } catch (error) {

            console.error(
                "RESET LOGIN PASSWORD ERROR:",
                error
            );

            showMessage(
                "Server connection failed.",
                true
            );

            resetBtn.disabled = false;

            resetBtn.textContent =
                "Reset Login Password";

        }

    }
);

</script>

</body>
</html>
