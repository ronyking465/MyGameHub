/* =========================================
   GLOBAL
========================================= */

*{

    padding:0;

}

html{
    background:#120914;
}

/* =========================================
   MAIN CONTAINER
========================================= */

.my-page{

    padding:12px 12px 120px;
}


/* =========================================
   PROFILE HEADER
========================================= */

.profile-card{

    position:relative;

    width:100%;

    padding:20px 16px 18px;

    border-radius:24px;

    overflow:hidden;

    background:
    linear-gradient(
        145deg,
        rgba(103,48,80,.95),
        rgba(53,23,47,.96)

    border:1px solid rgba(255,255,255,.10);

    box-shadow:
    inset 0 1px rgba(255,255,255,.10),
    0 18px 40px rgba(0,0,0,.45),
    0 0 25px rgba(255,212,59,.08);
}


/* Glass shine */

.profile-card::before{

    content:"";

    position:absolute;

    top:-80px;
    right:-70px;

    width:190px;
    height:190px;

    border-radius:50%;

    background:
    radial-gradient(

        rgba(255,212,59,.18),

}


/* =========================================

========================================= */

/* Profile Details */

}

/* =========================================
   VIP BOX
========================================= */

.vip-box{

}

.vip-progress{

    height:7px;

.vip-progress-fill{

/* =========================================
   STATS
========================================= */

<script>

async function loadProfile() {

    try {

        const token =
            localStorage.getItem("token");


        const response = await fetch(

            "/api/user/profile",

            {

                method:"GET",

                headers:{
                    Authorization:
                    "Bearer " + token
                }

            }

        );


        const data =
            await response.json();


        if (data.success) {


            const user =
                data.user;


            const recharge =
                user.totalRecharge || 0;


            let vip = 0;

            let target = 3000;


            if (recharge >= 30000) {

                vip = 6;

                target = 30000;

            }

            else if (recharge >= 20000) {

                vip = 5;

                target = 30000;

            }

            else if (recharge >= 12000) {

                vip = 4;

                target = 20000;

            }

            else if (recharge >= 8000) {

                vip = 3;

                target = 12000;

            }

            else if (recharge >= 5000) {

                vip = 2;

                target = 8000;

            }

            else if (recharge >= 3000) {

                vip = 1;

                target = 5000;

            }


            document.getElementById(
                "vipLevel"
            ).innerText =
                "VIP " + vip;


            document.getElementById(
                "currentRecharge"
            ).innerText =
                "₹" + recharge;


            document.getElementById(
                "targetRecharge"
            ).innerText =
                "₹" + target;


            let percent =
                (recharge / target) * 100;


            if (percent > 100)

                percent = 100;


            document.getElementById(
                "vipProgress"
            ).style.width =
                percent + "%";


            setUserMobile(user.mobile);


            document.getElementById(
                "balance"
            ).innerText =
                "₹" +
                user.balance.toFixed(2);


            document.getElementById(
                "totalIncome"
            ).innerText =
                "₹" +
                user.totalIncome.toFixed(2);


            document.getElementById(
                "totalRecharge"
            ).innerText =
                "₹" +
                (user.rechargeBalance || 0)
                .toFixed(2);


        }

        else {

            showPopup(
                data.message
            );

        }


    }

    catch (error) {

        console.error(
            error
        );

    }

}

function logout() {

    showConfirm("Are you sure you want to logout?", function () {

        localStorage.removeItem("isLogin");
        localStorage.removeItem("currentUser");
        localStorage.removeItem("token");

        showSuccess("Logout Successful");

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);

    });

}

let originalMobileNumber = "";
let mobileHidden = false;

function setUserMobile(number){

    originalMobileNumber = String(number || "");
    mobileHidden = false;

    document.getElementById("userMobile").innerText =
        originalMobileNumber;

    document.querySelector("#mobileEyeBtn i").className =
        "fas fa-eye";
}

function toggleMobileNumber(){

    if(!originalMobileNumber) return;

    mobileHidden = !mobileHidden;

    if(mobileHidden){

        document.getElementById("userMobile").innerText =
            originalMobileNumber.substring(0,3) +
            "****" +
            originalMobileNumber.substring(7);

        document.querySelector("#mobileEyeBtn i").className =
            "fas fa-eye-slash";

    }else{

        document.getElementById("userMobile").innerText =
            originalMobileNumber;

        document.querySelector("#mobileEyeBtn i").className =
            "fas fa-eye";
    }
}
